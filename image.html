<!DOCTYPE html>
<html>
    <head>
    <title>Image HTML dan CSS</title>
    <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <!-- cara menambahkan gambar: png.jpg.gif -->
         <p>ini adalah gambar dengan ukuran normal</p>
         <img src="catze 2.jpg" alt="Cat thinking">
         <!-- cara merubah ukuran gambar -->
          <p>ini adalah gambar yang sudah diganti ukuran</p>
          <img src="ps.jpg" alt="flower" class="ukuran">
          <!-- cara menambahkan lengkungan pada gambar -->
           <p>ini adalah gambar yang sudah diberi lengkungan</p>
           <img src="polaroid love.jpg" alt="polaroid photo" class="lengkungan">
           <!-- cara menggabungkan gambar dan text -->
            <div class="kelompok">
<img src="polaroid love.jpg" alt="polaroid love">
<p>Foto kita blur </p>
            </div>
            <!-- cara memberikan efek hover -->
             <div class="efek">
                <img src="catze.jpg" alt="cat liking">
                <p>Ini contoh hover</p>
             </div>
             <!-- ini font internal -->
              <p class="internal"> ini contoh font internal </p>
              <!-- ini font exsternal -->
               <p class="external"> ini contoh font eksternal</p>
    </body>
</html>
